app = "quantfoundry-code-runner"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  QF_RUNNER_HOST = "0.0.0.0"
  QF_RUNNER_PORT = "3010"

[http_service]
  internal_port = 3010
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
