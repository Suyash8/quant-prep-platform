app = "quantfoundry-code-runner"
primary_region = "iad"

# Private internal Fly service only (reached via http://quantfoundry-code-runner.internal:3010).
# Set CODE_RUNNER_AUTH_TOKEN (>= 32 chars) via `fly secrets set CODE_RUNNER_AUTH_TOKEN=...`.

[build]
  dockerfile = "Dockerfile"

[env]
  QF_RUNNER_HOST = "fly-local-6pn"
  QF_RUNNER_PORT = "3010"

[[checks.health]]
  port = 3010
  type = "http"
  interval = "15s"
  timeout = "3s"
  grace_period = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
